name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (without the leading v)
        required: true
        default: '1.0.7'
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node dependencies
        run: npm ci

      - name: Apply speech plugin compatibility fix for AGP 9
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'node_modules/@capacitor-community/speech-recognition/android/build.gradle';
          const source = fs.readFileSync(path, 'utf8');
          const legacy = "proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'";
          const supported = "proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'";
          if (source.includes(legacy)) {
            fs.writeFileSync(path, source.replace(legacy, supported));
          } else if (!source.includes(supported)) {
            throw new Error('Unexpected speech-recognition ProGuard configuration; review the plugin before building.');
          }
          NODE

      - name: Generate web and Android configuration
        run: npm run build:config
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare Android release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$RELEASE_VERSION"
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release version must use x.y.z format'; exit 1; }
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Check release notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTES="download-site/release-notes/${RELEASE_TAG}.md"
          test -s "$NOTES" || {
            echo "Add readable release notes to $NOTES before building this version."
            exit 1
          }

      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is required'; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          test -s "$RUNNER_TEMP/release-keystore.jks"

      - name: Validate signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: android
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

      - name: Verify Android AI endpoint is packaged
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -p "$APK" assets/public/js/config.js | grep -Fq 'https://cruzflix.netlify.app/.netlify/functions/gemini-chat' || {
            echo 'Android APK is missing the MoviesHub AI endpoint.'
            exit 1
          }

      - name: Verify signed APK exists
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo 'Signed APK was not produced'; exit 1; }
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/MoviesHub.apk
          test -s dist/MoviesHub.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MoviesHub ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: download-site/release-notes/${{ steps.version.outputs.tag }}.md
          generate_release_notes: false
          make_latest: true
          files: dist/MoviesHub.apk
          fail_on_unmatched_files: true
