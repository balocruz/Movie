<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviesHub</title>
    <meta name="theme-color" content="#101010">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-loading" class="app-loading" role="status" aria-live="polite">
        <img class="app-loading-logo" src="favicon.svg" alt="">
        <strong class="app-loading-title">Movies<span>Hub</span></strong>
        <span class="app-loading-caption">Loading...</span>
        <span class="app-loading-indicator" aria-hidden="true"></span>
    </div>
    <main id="browse-page">
        <!-- Top Navigation & Search -->
        <header class="app-header">
            <h1 class="logo">Movies<span>Hub</span></h1>
            <nav class="primary-nav" aria-label="Main navigation">
                <button class="nav-btn active" type="button" data-view="home" aria-current="page">Discover</button>
                <button class="nav-btn" type="button" data-view="history">Recently Watched</button>
                <button class="nav-btn" type="button" data-view="my-list">My List</button>
            </nav>
            <div class="search-box">
                <label class="visually-hidden" for="search">Search movies and TV shows</label>
                <input type="search" id="search" placeholder="Search movies, TV shows..." autocomplete="off" aria-controls="search-suggestions">
                <button id="btn" type="button">Search</button>
                <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions" hidden></div>
            </div>
        </header>

        <div id="browse-content">
            <nav class="genre-bar" id="genre-bar" aria-label="Browse by genre">
                <button class="genre-btn active" data-genre="all" tabindex="0">All</button>
                <button class="genre-btn" data-movie-genre="28" data-tv-genre="10759" tabindex="0">Action</button>
                <button class="genre-btn" data-movie-genre="35" data-tv-genre="35" tabindex="0">Comedy</button>
                <button class="genre-btn" data-movie-genre="18" data-tv-genre="18" tabindex="0">Drama</button>
                <button class="genre-btn" data-movie-genre="878" data-tv-genre="10765" tabindex="0">Sci-Fi</button>
                <button class="genre-btn" data-movie-genre="27" tabindex="0">Horror</button>
                <button class="genre-btn" data-movie-genre="10749" tabindex="0">Romance</button>
                <button class="genre-btn" data-movie-genre="16" data-tv-genre="16" tabindex="0">Animation</button>
            </nav>
            <div id="categories-container"></div>
        </div>

        <section id="details-page" class="details-page" aria-labelledby="details-title" hidden>
            <button id="details-back" class="back-button" type="button">Back</button>
            <div class="details-hero">
                <img id="details-backdrop" class="details-backdrop" alt="" loading="lazy">
                <div class="details-shade"></div>
                <div class="details-copy">
                    <p id="details-type" class="section-eyebrow"></p>
                    <h2 id="details-title" class="details-title">Loading title...</h2>
                    <p id="details-meta" class="details-meta"></p>
                    <div id="details-genres" class="details-genres"></div>
                    <p id="details-overview" class="details-overview"></p>
                    <div class="details-actions">
                        <button id="details-play" class="primary-action" type="button">Play</button>
                        <button id="details-list" class="secondary-action" type="button" aria-pressed="false">Add to My List</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <section id="player-container" class="player-container" aria-label="Video player">
        <div class="player-header">
            <button id="close-pip-btn" class="player-action" type="button" aria-label="Close player">← Browse</button>
            <div class="player-heading">
                <h2 id="player-title" class="player-title">Now Playing</h2>
                <p id="player-subtitle" class="player-subtitle"></p>
            </div>
            <button id="fullscreen-player-btn" class="player-action" type="button" aria-label="Enter fullscreen">Fullscreen</button>
            <button id="pip-player-btn" class="player-action" type="button" aria-label="Minimize player">Minimize</button>
            <button id="close-mini-player-btn" class="player-action close-mini-player" type="button" aria-label="Close player">×</button>
        </div>
        <div id="tv-controls-host"></div>
        <div class="video-wrapper">
            <iframe
                id="player"
                src=""
                title="Video player"
                allowfullscreen
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                referrerpolicy="no-referrer">
            </iframe>
        </div>
    </section>

    <script type="module" src="js/app.js"></script>
</body>
</html>
