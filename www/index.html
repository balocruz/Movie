<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviesHub</title>
    <meta name="theme-color" content="#101010">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-loading" class="app-loading" role="status" aria-live="polite">
        <img class="app-loading-logo" src="favicon.svg" alt="">
        <strong class="app-loading-title">Movies<span>Hub</span></strong>
        <span class="app-loading-caption">Loading...</span>
        <span class="app-loading-indicator" aria-hidden="true"></span>
    </div>
    <main id="browse-page">
        <!-- Top Navigation & Search -->
        <header class="app-header">
            <h1 class="logo">Movies<span>Hub</span></h1>
            <nav class="primary-nav" aria-label="Main navigation">
                <button class="nav-btn active" type="button" data-view="home" aria-current="page">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m15.8 8.2-2.6 5.2-5 2.4 2.4-5z"></path></svg>
                    <span>Discover</span>
                </button>
                <button class="nav-btn" type="button" data-view="history" aria-label="Recently Watched">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                    <span class="nav-label-full">Recently Watched</span>
                    <span class="nav-label-short">Watched</span>
                </button>
                <button class="nav-btn" type="button" data-view="my-list">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21z"></path></svg>
                    <span>My List</span>
                </button>
                <button class="nav-btn" type="button" data-view="chat">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6a7.5 7.5 0 1 1 17-3.5Z"></path><path d="M12.5 7.5v4m-2-2h4"></path></svg>
                    <span>AI Chat</span>
                </button>
            </nav>
            <div class="search-box" id="search-box">
                <label class="visually-hidden" for="search">Search movies and TV shows</label>
                <input type="search" id="search" placeholder="Search movies, TV shows..." autocomplete="off" aria-controls="search-suggestions">
                <button id="btn" type="button">Search</button>
                <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions" hidden></div>
            </div>
        </header>

        <div id="browse-content">
            <nav class="genre-bar" id="genre-bar" aria-label="Browse by genre">
                <button class="genre-btn active" data-genre="all" tabindex="0">All</button>
                <button class="genre-btn" data-movie-genre="28" data-tv-genre="10759" tabindex="0">Action</button>
                <button class="genre-btn" data-movie-genre="35" data-tv-genre="35" tabindex="0">Comedy</button>
                <button class="genre-btn" data-movie-genre="18" data-tv-genre="18" tabindex="0">Drama</button>
                <button class="genre-btn" data-movie-genre="878" data-tv-genre="10765" tabindex="0">Sci-Fi</button>
                <button class="genre-btn" data-movie-genre="27" tabindex="0">Horror</button>
                <button class="genre-btn" data-movie-genre="10749" tabindex="0">Romance</button>
                <button class="genre-btn" data-movie-genre="16" data-tv-genre="16" tabindex="0">Animation</button>
            </nav>
            <div id="categories-container"></div>
        </div>

        <section id="details-page" class="details-page" aria-labelledby="details-title" hidden>
            <button id="details-back" class="back-button" type="button">Back</button>
            <div class="details-hero">
                <img id="details-backdrop" class="details-backdrop" alt="" loading="lazy">
                <div class="details-shade"></div>
                <div class="details-copy">
                    <p id="details-type" class="section-eyebrow"></p>
                    <h2 id="details-title" class="details-title">Loading title...</h2>
                    <p id="details-meta" class="details-meta"></p>
                    <div id="details-genres" class="details-genres"></div>
                    <p id="details-overview" class="details-overview"></p>
                    <div class="details-actions">
                        <button id="details-play" class="primary-action" type="button">Play</button>
                        <button id="details-list" class="secondary-action" type="button" aria-pressed="false">Add to My List</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="chat-page" class="chat-page" aria-labelledby="chat-heading" hidden>
            <h2 id="chat-heading" class="visually-hidden">MoviesHub AI chat</h2>
            <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions">
                <div id="chat-welcome" class="chat-welcome">
                    <span class="chat-welcome-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 14.7 9l6.5 2.8-6.5 2.7-2.7 6.7-2.7-6.7L2.8 11.8 9.3 9z"></path><path d="m19 2 .8 1.8 1.7.7-1.7.8L19 7l-.8-1.7-1.7-.8 1.7-.7z"></path></svg>
                    </span>
                    <h3>Welcome. What are you in the mood for?</h3>
                    <p>Tell me what you like, or ask about a movie.</p>
                </div>
            </div>
            <form id="chat-form" class="chat-form">
                <label class="visually-hidden" for="chat-input">Ask MoviesHub AI</label>
                <textarea id="chat-input" name="message" rows="1" maxlength="2000" placeholder="Ask for a movie recommendation or review..." required></textarea>
                <button id="chat-send" class="primary-action" type="submit" aria-label="Send message">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 3-7.5 18-3.8-7.7L2 9.5 21 3Z"></path><path d="M9.7 13.3 21 3"></path></svg>
                    <span class="visually-hidden">Send</span>
                </button>
            </form>
            <p class="chat-disclaimer">AI can make mistakes. Reviews are spoiler-free unless you ask for spoilers.</p>
        </section>
    </main>

    <section id="player-container" class="player-container" aria-label="Video player">
        <div class="player-header">
            <button id="close-pip-btn" class="player-action player-back" type="button" aria-label="Close player">← Browse</button>
            <div class="player-heading" aria-live="polite">
                <p class="player-eyebrow">NOW PLAYING</p>
                <h2 id="player-title" class="player-title">Now Playing</h2>
                <p id="player-subtitle" class="player-subtitle"></p>
            </div>
            <div class="player-actions">
                <button id="fullscreen-player-btn" class="player-action" type="button" aria-label="Enter fullscreen">Fullscreen</button>
                <button id="pip-player-btn" class="player-action" type="button" aria-label="Minimize player">Minimize</button>
                <button id="close-mini-player-btn" class="player-action close-mini-player" type="button" aria-label="Close player">×</button>
            </div>
        </div>
        <div id="tv-controls-host"></div>
        <div class="player-stage">
            <div class="video-wrapper">
                <iframe
                    id="player"
                    src=""
                    title="Video player"
                    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                    referrerpolicy="no-referrer">
                     
                </iframe>
            </div>
        </div>
    </section>

    <script type="module" src="js/app.js"></script>
</body>
</html>
